[project]
name = "judgement-mcp"
version = "0.1.0"
description = "The Court of Judgement (誅伏賜死) — MCP server with cinematic web UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
judgement-mcp = "judgement_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judgement_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"judgement_mcp/web" = "judgement_mcp/web"
